name: Daily update

on:
  schedule:
    # UTC 23:00 = 北京时间次日 07:00
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "回溯天数（首次回填建议 90）"
        required: false
        default: "7"

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
      # 可选：AI 问答 Worker 的地址；在仓库 Variables 中设置 CHAT_API_URL
      CHAT_API_URL: ${{ vars.CHAT_API_URL }}
      TZ: Asia/Shanghai
      # 可选：在仓库 Secrets 中设置 ZENODO_TOKEN 可提高 Zenodo 检索限额
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
      # 可选：IEEE Xplore 官方 Metadata API key（https://developer.ieee.org/）
      IEEE_API_KEY: ${{ secrets.IEEE_API_KEY }}
      # 可选：Springer Nature Meta API key（https://dev.springernature.com/）
      SPRINGER_API_KEY: ${{ secrets.SPRINGER_API_KEY }}
      # 可选：Semantic Scholar 免费 API key，可提高摘要补全的限流额度
      S2_API_KEY: ${{ secrets.S2_API_KEY }}
      # 可选：智谱 GLM-4-Flash 免费 key，用于中文一句话摘要
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      # 可选：微信推送，三选一或全配（见 README）
      WECHAT_WEBHOOK: ${{ secrets.WECHAT_WEBHOOK }}
      PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
      SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Collect and render
        run: node src/main.js --days "${{ github.event.inputs.days || '7' }}"

      - name: Validate generated files
        run: node scripts/validate.mjs

      - name: Notify WeChat
        continue-on-error: true
        run: node scripts/notify.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: daily update $(date +%F)"

          # 手动 push 可能和定时任务同时发生；被拒绝时先同步远程再重试。
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); syncing with remote..."
            if ! git pull --rebase origin main; then
              git rebase --abort || true
              echo "Rebase conflict; keep generated data and re-render..."
              git pull --no-rebase -X ours origin main -m "chore: merge remote before daily push"
              node src/main.js --no-collect
              git add data docs
              git commit -m "chore: regenerate docs after merge" || true
            fi
          done

          echo "Failed to push after 3 attempts"
          exit 1
