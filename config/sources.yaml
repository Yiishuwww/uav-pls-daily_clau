# 数据源配置（一期零 key：arXiv + OpenAlex + Crossref）
#
# contact_email 可选。填写后 OpenAlex / Crossref 会把你放进 polite pool，
# 请求优先级更高。建议填一个常用邮箱；留空也能正常工作。
contact_email: ""

request_timeout_ms: 60000
retries: 3

arxiv:
  enabled: true
  max_results: 300

openalex:
  enabled: true
  per_page: 200
  max_pages: 3

# Crossref 覆盖 IEEE (263) / Elsevier (78) / Springer (297) / Wiley (311)。
# 即使没有这些出版商的官方 API key，也能拿到 DOI、标题、作者、期刊等元数据。
crossref:
  enabled: true
  rows: 200
  member_rows: 100
  members:
    - id: 263
      name: IEEE
    - id: 78
      name: Elsevier
    - id: 297
      name: Springer
    - id: 311
      name: Wiley

# Semantic Scholar Graph API：按 DOI / arXiv ID 批量补全缺失摘要。
# 无 key 也能用（共享限流，约 1 次/秒）；免费 key 可提高限额，申请：
# https://www.semanticscholar.org/product/api#api-key-form
# 申请后设置环境变量 S2_API_KEY；GitHub Actions 中用同名 Secret。
semanticscholar:
  enabled: true
  api_key_env: S2_API_KEY
  batch_size: 500     # 单次批量查询上限

# 开放获取期刊目录，无需 key。DOAJ 的复杂布尔查询不稳定，
# 采集器使用多条单字段查询，再由本地 PLS/UAV 规则过滤。
doaj:
  enabled: true
  page_size: 100
  max_pages: 1

# Zenodo 公开检索无需 key；如需更高限额，可在仓库 Secrets 中设置 ZENODO_TOKEN。
zenodo:
  enabled: true
  page_size: 100
  max_pages: 2

# IEEE Xplore 官方 Metadata API：期刊 / 会议 / Early Access 元数据与摘要。
# 免费 key 申请：https://developer.ieee.org/ → Get an API Key（审批通常几个工作日）。
# 申请后在本地设置环境变量 IEEE_API_KEY；GitHub Actions 中用同名 Secret。
# 没有 key 时该源会自动跳过，不影响其他数据源。
ieee:
  enabled: true
  api_key_env: IEEE_API_KEY
  page_size: 200      # 单次请求上限 200
  max_pages: 3        # 每条最多翻 3 页（600 条）；IEEE 接口默认按相关性排序，需要翻页才能覆盖近期入库记录
  # 可选：自定义布尔检索式；留空使用采集器内置的三条查询。
  # queries:
  #   - '("physical layer security" OR secrecy) AND (UAV OR drone)'

# 二期（需要免费 API key）可直接在此扩展，并在 src/collectors/ 下新增适配器：
# springer:{ enabled: false }   # https://dev.springernature.com
# elsevier:{ enabled: false }   # https://dev.elsevier.com
# wos:     { enabled: false }   # 需要机构订阅
